---
include:
  - ./actualbudget/docker-compose.yml   # actual - budgeting
  - ./mealie/docker-compose.yml         # mealie - recipes
  - ./paperless/docker-compose.yml      # paperless - documents
  - ./glance/docker-compose.yml         # glance - dashboard
#  - ./immich/docker-compose.yml         # immich - img host
  - ./chibisafe/docker-compose.yml      # chibi - file host
  - ./omni-tools/docker-compose.yml     # tools - multi tools
  - ./bullet/docker-compose.yml         # bullet - .md editor
  - ./track/docker-compose.yml          # track - media tracker (watched, to watch, etc)

services:
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: always
    container_name: ${NGINX_HOST}
    env_file: 
      - .env.config
      - .env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - actual
      - mealie
      - paperless
      - glance
      - chibi
#      - tools
      - bullet
      - track
 
volumes:
  caddy_data:
  caddy_config:
 

